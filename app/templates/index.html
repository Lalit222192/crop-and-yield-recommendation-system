<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Crop Recommender & Yield Prediction</title>

    <!-- Bootstrap 5 -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">

    <!-- Google Font -->
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;600;700&display=swap" rel="stylesheet">

    <style>
        body {
            font-family: 'Poppins', sans-serif;
            background: linear-gradient(135deg, #e8f5e9, #e3f2fd);
            min-height: 100vh;
        }

        .main-card {
            background: white;
            border-radius: 18px;
            padding: 30px;
            box-shadow: 0 15px 40px rgba(0,0,0,0.1);
            animation: fadeIn 0.8s ease;
        }

        h1 {
            font-weight: 700;
            color: #2e7d32;
        }

        h2 {
            font-weight: 600;
            margin-bottom: 20px;
        }

        .btn-primary {
            background: linear-gradient(45deg, #2e7d32, #43a047);
            border: none;
            padding: 12px 25px;
            font-weight: 600;
            border-radius: 30px;
        }

        .btn-secondary {
            border-radius: 30px;
            padding: 12px 25px;
        }

        .result-box {
            background: #f1f8e9;
            border-left: 6px solid #43a047;
            padding: 15px;
            border-radius: 10px;
            margin-top: 20px;
            animation: slideUp 0.6s ease;
        }

        .spinner {
            display: none;
        }

        input:focus {
            box-shadow: 0 0 0 0.2rem rgba(67,160,71,0.25);
        }

        @keyframes fadeIn {
            from {opacity: 0; transform: translateY(20px);}
            to {opacity: 1; transform: translateY(0);}
        }

        @keyframes slideUp {
            from {opacity: 0; transform: translateY(15px);}
            to {opacity: 1; transform: translateY(0);}
        }
    </style>
</head>

<body>
<div class="container py-5">
    <div class="main-card mx-auto">

        <h1 class="text-center mb-4">🌾 Crop Recommender & Yield Prediction</h1>

        <!-- ================= Crop Recommendation ================= -->
        <h2>Crop Recommendation</h2>
        <form id="recForm" action="/recommend" method="POST" class="row g-3 needs-validation" novalidate>

            <div class="col-md-4">
                <label class="form-label">Nitrogen</label>
                <input type="number" step="any" class="form-control" name="N" required>
            </div>

            <div class="col-md-4">
                <label class="form-label">Phosphorus</label>
                <input type="number" step="any" class="form-control" name="P" required>
            </div>

            <div class="col-md-4">
                <label class="form-label">Potassium</label>
                <input type="number" step="any" class="form-control" name="K" required>
            </div>

            <div class="col-md-4">
                <label class="form-label">Temperature (°C)</label>
                <input type="number" step="any" class="form-control" name="temperature" required>
            </div>

            <div class="col-md-4">
                <label class="form-label">Humidity (%)</label>
                <input type="number" step="any" class="form-control" name="humidity" required>
            </div>

            <div class="col-md-4">
                <label class="form-label">pH Level</label>
                <input type="number" step="any" class="form-control" name="ph" required>
            </div>

            <div class="col-md-6">
                <label class="form-label">Rainfall (mm)</label>
                <input type="number" step="any" class="form-control" name="rainfall" required>
            </div>

            <div class="col-12 text-center mt-3">
                <button class="btn btn-primary" type="submit">Get Recommendation</button>
                <button class="btn btn-secondary ms-2" type="reset">Clear</button>
                <div class="spinner spinner-border spinner-border-sm ms-3" id="recSpinner"></div>
            </div>
        </form>

        {% if rec %}
        <div class="result-box text-center">
            <h5>🌱 Recommended Crop</h5>
            <strong>{{ rec }}</strong>
        </div>
        {% endif %}

        <hr class="my-5">

        <!-- ================= Yield Prediction ================= -->
        <h2>Yield Prediction</h2>
        <form id="yieldForm" action="/yield" method="POST" class="row g-3 needs-validation" novalidate>

            <div class="col-md-6">
                <label class="form-label">Crop Item</label>
                <input type="text" class="form-control" name="Item" required>
            </div>

            <div class="col-md-6">
                <label class="form-label">Year</label>
                <input type="number" class="form-control" name="Year" required>
            </div>

            <div class="col-md-4">
                <label class="form-label">Avg Rainfall (mm)</label>
                <input type="number" step="any" class="form-control" name="average_rain_fall_mm_per_year" required>
            </div>

            <div class="col-md-4">
                <label class="form-label">Pesticides (tonnes)</label>
                <input type="number" step="any" class="form-control" name="pesticides_tonnes" required>
            </div>

            <div class="col-md-4">
                <label class="form-label">Avg Temperature (°C)</label>
                <input type="number" step="any" class="form-control" name="avg_temp" required>
            </div>

            <div class="col-12 text-center mt-3">
                <button class="btn btn-primary" type="submit">Predict Yield</button>
                <button class="btn btn-secondary ms-2" type="reset">Clear</button>
                <div class="spinner spinner-border spinner-border-sm ms-3" id="yieldSpinner"></div>
            </div>
        </form>

        {% if yie %}
        <div class="result-box text-center">
            <h5>📊 Predicted Yield</h5>
            <strong>{{ yie }}</strong>
        </div>
        {% endif %}

    </div>
</div>

<!-- Bootstrap JS -->
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>

<script>
    // Bootstrap validation + loading spinner
    (() => {
        const forms = document.querySelectorAll('.needs-validation');

        Array.from(forms).forEach(form => {
            form.addEventListener('submit', event => {
                if (!form.checkValidity()) {
                    event.preventDefault();
                    event.stopPropagation();
                } else {
                    const spinner = form.querySelector('.spinner');
                    if (spinner) spinner.style.display = 'inline-block';
                }
                form.classList.add('was-validated');
            }, false);
        });
    })();
</script>

</body>
</html>
